name: Deploy VoidSINT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        run: npm run build:gh

      - name: Copy favicon assets
        run: |
          cp favicon.ico dist/gh/ 2>/dev/null || true
          cp favicon.svg dist/gh/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/gh
          branch: gh-pages
          clean: true
          commit-message: "deploy: VoidSINT static build from ${{ github.sha }}"
