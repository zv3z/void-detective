services:
  - type: web
    name: voidsint-api
    runtime: node
    buildCommand: npm install && npm run build:server
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: voidsint-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://zv3z.github.io

databases:
  - name: voidsint-db
    databaseName: voidsint
    user: voidsint
    plan: free
